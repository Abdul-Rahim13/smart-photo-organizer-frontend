[build]
  command = "npm run build"
  publish = ".next"

# Handle client-side routing for Next.js
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy to your Railway backend (optional, but helpful)
[[redirects]]
  from = "/api/*"
  to = "https://smart-photo-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

# Handle 404 pages
[[redirects]]
  from = "/404.html"
  to = "/404"
  status = 200

# Images and static files
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"